spring:
  application:
    name: review-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/api/v1/auth/certs}
  datasource:
    # Cấu hình kết nối MySQL
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:review_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Tự động cập nhật schema
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Sử dụng dialect phù hợp cho MySQL 8
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8083

logging:
  level:
    com.studydocs.review: DEBUG
    org.hibernate.SQL: DEBUG

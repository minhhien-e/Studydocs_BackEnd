server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: studydoc

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://${MONGO_USERNAME:admin}:${MONGO_PASSWORD:password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:user_service_db}?authSource=admin}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:studydocs-app}
  client-id: ${KEYCLOAK_CLIENT_ID:studydocs-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  default-registration-role: ${KEYCLOAK_DEFAULT_REGISTRATION_ROLE:CUSTOMER}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
